---
name: Forecast
description: The day's weather written out, with the date
strategy: polling
polling_verb: get
polling_url: https://api.open-meteo.com/v1/forecast?latitude={{ location | split: ',' | first | strip }}&longitude={{ location | split: ',' | last | strip }}&current=temperature_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m,is_day&hourly=temperature_2m,precipitation_probability,precipitation,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,wind_speed_10m_max,wind_direction_10m_dominant,sunrise,sunset&forecast_hours=36&forecast_days=2&wind_speed_unit=mph&timezone=auto
polling_headers: ''
refresh_interval: 15
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
framework_version: latest
custom_fields:
- keyname: location
  field_type: lat_lon
  name: Location
  description: Search for a place or postcode, or type latitude,longitude.
  default: 51.4660,-0.0880
- keyname: place_name
  field_type: string
  name: Place name
  description: Shown at the bottom of the screen.
  default: Denmark Hill
  optional: true

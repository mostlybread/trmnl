# Cloudflare deploys the Worker from this folder whenever main changes on GitHub
# (Workers Builds: root directory trmnl-server, build `npm install && npm run build`,
# deploy `npx wrangler deploy`). The name must match the Worker in the dashboard.
name = "trmnl"
main = "dist/worker.js"
compatibility_date = "2026-10-01"

# Keep the variables set in the dashboard (RAIN_MINUTES etc.). Secrets are always kept.
keep_vars = true

[observability]
enabled = true

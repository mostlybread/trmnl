# Cloudflare deploys the Worker from this repository whenever main changes on GitHub
# (Workers Builds: build command `npm run build`, deploy command `npx wrangler deploy`,
# root directory left blank). The name must match the Worker in the dashboard.
name = "trmnl"
main = "trmnl-server/dist/worker.js"
compatibility_date = "2026-10-01"

# Keep the variables set in the dashboard (RAIN_MINUTES etc.). Secrets are always kept.
keep_vars = true

[observability]
enabled = true

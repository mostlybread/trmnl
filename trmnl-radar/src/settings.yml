---
name: Rain radar
description: Rain radar map around you, with temperature and wind
strategy: polling
polling_verb: get
polling_url: |-
  https://api.rainviewer.com/public/weather-maps.json
  https://api.open-meteo.com/v1/forecast?latitude={{ location | split: ',' | first | strip }}&longitude={{ location | split: ',' | last | strip }}&current=temperature_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m,is_day&hourly=precipitation_probability,precipitation&forecast_hours=12&wind_speed_unit=mph&timezone=auto
polling_headers: ''
refresh_interval: 15
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
framework_version: latest
custom_fields:
- keyname: location
  field_type: lat_lon
  name: Location
  description: Search for a place or postcode, or type latitude,longitude. The map is centred here.
  default: 51.4660,-0.0880
- keyname: place_name
  field_type: string
  name: Place name
  description: Shown in the title bar.
  default: Denmark Hill
  optional: true
